<!doctype html><html><head><meta charset="utf-8"><title>Nordic Rail Shop — Interrail Travel Pillow</title>
<style>body{font:15px system-ui;max-width:720px;margin:40px auto}.step{display:none}.step.on{display:block}label{display:block;margin:6px 0}input{padding:5px}</style></head><body>
<header><b>Nordic Rail Shop</b> · <span id="cartn">Cart (0)</span></header>
<div class="step on" id="product"><h1>Interrail Travel Pillow</h1><p>Memory foam, washable cover. <b>€ 24.90</b></p>
 <label>Colour <select id="colour"><option>Grey</option><option>Navy</option><option>Forest green</option></select></label>
 <label>Quantity <input id="qty" type="number" value="1" min="1" max="5"></label>
 <button onclick="add()">Add to cart</button></div>
<div class="step" id="cart"><h1>Your cart</h1><p id="line"></p><button onclick="show('checkout')">Go to checkout</button></div>
<form class="step" id="checkout" onsubmit="event.preventDefault();review()"><h1>Shipping</h1>
 <label>Full name <input id="name" autocomplete="name" required></label>
 <label>Street and number <input id="street" autocomplete="street-address" required></label>
 <label>Postcode <input id="zip" autocomplete="postal-code" required></label>
 <label>City <input id="city" autocomplete="address-level2" required></label>
 <label>Email <input id="email" type="email" autocomplete="email" required></label>
 <h2>Payment</h2>
 <label><input type="radio" name="pay" value="saved" checked> Saved card •••• 4242</label>
 <label><input type="radio" name="pay" value="invoice"> Invoice</label>
 <label><input type="radio" name="pay" value="new"> New card:</label>
 <label>Card number <input id="ccnum" autocomplete="cc-number"></label><label>CVC <input id="cvc" autocomplete="cc-csc"></label>
 <button type="submit">Continue to review</button></form>
<div class="step" id="review"><h1>Review your order</h1><p id="sum"></p><p>Shipping: € 4.90</p><p><b id="total"></b></p>
 <button onclick="place()">Place order</button></div>
<div class="step" id="done"><h1>Thank you for your order!</h1><p id="ok"></p></div>
<script>
let qty=1, colour='Grey';
function show(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');}
function add(){qty=+document.getElementById('qty').value;colour=document.getElementById('colour').value;document.getElementById('cartn').textContent='Cart ('+qty+')';
 document.getElementById('line').textContent=qty+' × Interrail Travel Pillow ('+colour+') — € '+(24.9*qty).toFixed(2);show('cart');}
function review(){const v=id=>document.getElementById(id).value;const pay=document.querySelector('[name=pay]:checked').value;
 document.getElementById('sum').textContent=qty+' × Interrail Travel Pillow ('+colour+'), to '+v('name')+', '+v('street')+', '+v('zip')+' '+v('city')+', paid by '+(pay==='saved'?'card •••• 4242':pay);
 document.getElementById('total').textContent='Total: € '+(24.9*qty+4.9).toFixed(2);show('review');}
function place(){window.__result={ordered:true,qty,colour,name:document.getElementById('name').value,city:document.getElementById('city').value};
 document.getElementById('ok').textContent='Order #NR-20417 confirmed. A confirmation email is on its way.';show('done');}
</script></body></html>
