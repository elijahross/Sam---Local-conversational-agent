[package]
name = "voice-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
voice_activity_detector = "0.2"
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "deflate", "form", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["fs"] }
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turbovec = "1.1.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dom_smoothie = "0.18.2"
scraper = "0.27.0"
url = "2.5.8"
regex = "1.13.1"
base64 = "0.23.1"
pdf-extract = "0.12.1"
hmac = "0.13.0"
sha1 = "0.11.0"
data-encoding = "2.11.1"
rpassword = "7.5.4"
aes-gcm = "0.11.1"
rand = "0.10.3"
xberg = { version = "1.3.6", default-features = false, features = ["tokio-runtime", "pdf", "office", "excel"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rust_xlsxwriter = "0.79"

[profile.release]
debug = false
